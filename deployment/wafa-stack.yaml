AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Well-Architected Foundations Assessment (WAFA) — Automated governance assessment for
  AWS Organizations. Deploys CodeBuild project, IAM role, S3 bucket, and optional
  SNS notification.

Parameters:
  EmailAddress:
    Type: String
    Default: ''
    Description: >
      (Optional) Email address for assessment completion notifications.
      Leave blank to skip SNS topic creation.

  SourceBucket:
    Type: String
    Description: S3 bucket name containing the WAFA source zip.

  SourceKey:
    Type: String
    Default: 'wafa-source.zip'
    Description: S3 object key for the source zip (used with SourceBucket).

Conditions:
  CreateSNSTopic: !Not [!Equals [!Ref EmailAddress, '']]

Resources:
  # ============================================================================
  # S3 Bucket — Report storage (FR-1.2, NFR-1.3)
  # ============================================================================
  WAFAResultsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      LoggingConfiguration:
        LogFilePrefix: wafa-access-logs/
      Tags:
        - Key: Application
          Value: WAFA

  # ============================================================================
  # IAM Role — ReadOnly assessment permissions (FR-1.2, NFR-1.1, NFR-1.2)
  # ============================================================================
  WAFARole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'WAFAAssessmentRole-${AWS::StackName}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Ref WAFAAssessmentPolicy

  WAFAAssessmentPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: Read-only assessment and report upload permissions for WAFA
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          # Assessment read-only permissions
          - Effect: Allow
            Action:
              - sts:GetCallerIdentity
              - organizations:DescribeOrganization
              - organizations:ListAWSServiceAccessForOrganization
              - organizations:ListRoots
              - organizations:ListAccounts
              - organizations:ListOrganizationalUnitsForParent
              - organizations:ListDelegatedAdministrators
              - organizations:ListDelegatedServicesForAccount
              - controltower:ListLandingZones
              - controltower:GetLandingZone
              - cur:DescribeReportDefinitions
              - bcm-data-exports:ListExports
              - cloudtrail:DescribeTrails
              - config:DescribeConfigurationRecorders
              - config:DescribeConfigurationRecorderStatus
              - config:DescribeDeliveryChannels
              - config:DescribeDeliveryChannelStatus
              - ec2:DescribeInstances
              - ec2:DescribeVpcs
              - ec2:DescribeRegions
              - iam:ListUsers
              - sso:ListInstances
              - cloudformation:DescribeOrganizationsAccess
            Resource: '*'
          # S3 write for report upload
          - Effect: Allow
            Action:
              - s3:PutObject
            Resource: !Sub '${WAFAResultsBucket.Arn}/*'
          # S3 read for source bucket
          - Effect: Allow
            Action:
              - s3:GetBucketAcl
              - s3:GetBucketLocation
              - s3:GetBucketVersioning
            Resource: !Sub 'arn:${AWS::Partition}:s3:::${SourceBucket}'
          - Effect: Allow
            Action:
              - s3:GetObject
              - s3:GetObjectVersion
              - s3:GetObjectTagging
              - s3:GetObjectVersionTagging
            Resource: !Sub 'arn:${AWS::Partition}:s3:::${SourceBucket}/*'
          # CloudWatch Logs for CodeBuild (scoped to specific log group)
          - Effect: Allow
            Action:
              - logs:CreateLogGroup
            Resource:
              - !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/WAFA-${AWS::StackName}'
          - Effect: Allow
            Action:
              - logs:CreateLogStream
              - logs:PutLogEvents
            Resource:
              - !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/WAFA-${AWS::StackName}:*'
          # SNS publish (conditional)
          - !If
            - CreateSNSTopic
            - Effect: Allow
              Action:
                - sns:Publish
              Resource: !Ref WAFANotificationTopic
            - !Ref 'AWS::NoValue'

  # ============================================================================
  # CodeBuild Project — Assessment execution (FR-1.2)
  # ============================================================================
  WAFAProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub 'WAFA-${AWS::StackName}'
      Description: Well-Architected Foundations Assessment — automated governance check
      Source:
        Type: S3
        Location: !Sub '${SourceBucket}/${SourceKey}'
        BuildSpec: buildspec.yml
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/standard:7.0
        EnvironmentVariables:
          - Name: RESULTS_BUCKET
            Value: !Ref WAFAResultsBucket
          - Name: SNS_TOPIC_ARN
            Value: !If [CreateSNSTopic, !Ref WAFANotificationTopic, '']
      ServiceRole: !GetAtt WAFARole.Arn
      Artifacts:
        Type: NO_ARTIFACTS
      TimeoutInMinutes: 10
      Tags:
        - Key: Application
          Value: WAFA

  # ============================================================================
  # SNS Topic — Optional notification (FR-1.2, FR-10.5)
  # ============================================================================
  WAFANotificationTopic:
    Type: AWS::SNS::Topic
    Condition: CreateSNSTopic
    Properties:
      TopicName: !Sub 'WAFA-Notifications-${AWS::StackName}'
      KmsMasterKeyId: alias/aws/sns

  WAFANotificationSubscription:
    Type: AWS::SNS::Subscription
    Condition: CreateSNSTopic
    Properties:
      TopicArn: !Ref WAFANotificationTopic
      Protocol: email
      Endpoint: !Ref EmailAddress

  # ============================================================================
  # Custom Resource Lambda — Auto-trigger CodeBuild on stack creation (FR-1.3)
  # ============================================================================
  WAFATriggerLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Ref WAFATriggerPolicy

  WAFATriggerPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: Permissions for the WAFA trigger Lambda
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - codebuild:StartBuild
            Resource: !GetAtt WAFAProject.Arn
          - Effect: Allow
            Action:
              - logs:CreateLogGroup
            Resource:
              - !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/WAFATriggerLambda-*'
          - Effect: Allow
            Action:
              - logs:CreateLogStream
              - logs:PutLogEvents
            Resource:
              - !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/WAFATriggerLambda-*:*'

  WAFATriggerLambda:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt WAFATriggerLambdaRole.Arn
      Timeout: 30
      Code:
        ZipFile: |
          import boto3
          import cfnresponse

          def handler(event, context):
              if event['RequestType'] == 'Delete':
                  cfnresponse.send(event, context, cfnresponse.SUCCESS, {})
                  return

              try:
                  project_name = event['ResourceProperties']['ProjectName']
                  client = boto3.client('codebuild')
                  client.start_build(projectName=project_name)
                  cfnresponse.send(event, context, cfnresponse.SUCCESS, {
                      'Message': f'Build started for {project_name}'
                  })
              except Exception as e:
                  cfnresponse.send(event, context, cfnresponse.FAILED, {
                      'Error': str(e)
                  })

  WAFATrigger:
    Type: Custom::WAFATrigger
    Properties:
      ServiceToken: !GetAtt WAFATriggerLambda.Arn
      ProjectName: !Ref WAFAProject

Outputs:
  ResultsBucket:
    Description: S3 bucket containing WAFA assessment reports
    Value: !Ref WAFAResultsBucket

  ResultsURL:
    Description: S3 console URL for assessment results
    Value: !Sub 'https://s3.console.aws.amazon.com/s3/buckets/${WAFAResultsBucket}'

  CodeBuildProject:
    Description: CodeBuild project name (click Start build to re-run)
    Value: !Ref WAFAProject

  CodeBuildConsoleURL:
    Description: CodeBuild console URL
    Value: !Sub 'https://${AWS::Region}.console.aws.amazon.com/codesuite/codebuild/projects/${WAFAProject}/history'
