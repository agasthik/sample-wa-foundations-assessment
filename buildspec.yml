version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.12
    commands:
      - pip install -r requirements.txt

  build:
    commands:
      - echo "Starting WAFA Assessment..."
      - python -m src.main --output s3://$RESULTS_BUCKET/

  post_build:
    commands:
      - echo "WAFA Assessment complete."
      - |
        if [ -n "$SNS_TOPIC_ARN" ]; then
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          aws sns publish \
            --topic-arn "$SNS_TOPIC_ARN" \
            --subject "WAFA Assessment Complete" \
            --message "Assessment complete for account $ACCOUNT_ID. Results: s3://$RESULTS_BUCKET/$ACCOUNT_ID/"
        fi
