name: ASH Full Repository Scan

on:
  push:
    branches: [main]
  schedule:
    # Monthly scan to catch new scanner rules and newly disclosed advisories.
    - cron: "0 2 1 * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  # Keep in sync with ash-security-scan.yml, README.md, and AGENTS.md.
  ASH_VERSION: v3.7.1

jobs:
  full-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install ASH
        run: pip install "git+https://github.com/awslabs/automated-security-helper.git@${ASH_VERSION}"

      - name: Run ASH full repository scan
        id: ash
        run: |
          set -o pipefail
          ash --mode container 2>&1 | tee ash-output.log
        # Collect the summary and reports before failing the job below.
        continue-on-error: true

      - name: Generate scan summary
        if: always()
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          echo "# ASH Full Repository Scan" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Scan Date:** $(date -u +%Y-%m-%dT%H:%M:%S+00:00)" >> "$GITHUB_STEP_SUMMARY"
          echo "**Trigger:** ${EVENT_NAME}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -f .ash/ash_output/reports/ash.summary.md ]; then
            cat .ash/ash_output/reports/ash.summary.md >> "$GITHUB_STEP_SUMMARY"
          elif [ -f ash-output.log ]; then
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -100 ash-output.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload scan results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ash-full-scan-results
          path: |
            ash-output.log
            .ash/ash_output/reports/
          if-no-files-found: ignore
          retention-days: 30

      - name: Fail on actionable findings
        if: steps.ash.outcome == 'failure'
        run: |
          echo "::error::ASH reported actionable findings. See the job summary and the ash-full-scan-results artifact."
          exit 1
