name: ASH Security Scan

on:
  # Pull requests only: a manual run has no base commit to diff against. Use
  # ash-full-repository-scan.yml for manual scans.
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  # Keep in sync with ash-full-repository-scan.yml, README.md, and AGENTS.md.
  ASH_VERSION: v3.7.1

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Copy changed files for scanning
        id: changed-files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          mkdir -p /tmp/ash-scan/.ash
          # Always scan with the repository configuration.
          cp .ash/.ash.yaml /tmp/ash-scan/.ash/.ash.yaml

          count=0
          echo "Changed files selected for ASH:"
          while IFS= read -r -d '' file; do
            if [ -f "$file" ]; then
              echo "  $file"
              mkdir -p "/tmp/ash-scan/$(dirname "$file")"
              cp "$file" "/tmp/ash-scan/$file"
              count=$((count + 1))
            fi
          done < <(git diff --name-only -z --diff-filter=ACMR "$BASE_SHA" HEAD)

          if [ "$count" -gt 0 ]; then
            echo "any_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "any_changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.changed-files.outputs.any_changed == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install ASH
        if: steps.changed-files.outputs.any_changed == 'true'
        run: pip install "git+https://github.com/awslabs/automated-security-helper.git@${ASH_VERSION}"

      - name: Run ASH scan on changed files
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          set -o pipefail
          ash --mode container \
            --source-dir /tmp/ash-scan \
            --output-dir /tmp/ash-output \
            2>&1 | tee /tmp/ash-output.log

      - name: Add ASH summary
        if: always() && steps.changed-files.outputs.any_changed == 'true'
        run: |
          echo "## ASH Security Scan" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -f /tmp/ash-output/reports/ash.summary.md ]; then
            cat /tmp/ash-output/reports/ash.summary.md >> "$GITHUB_STEP_SUMMARY"
          elif [ -f /tmp/ash-output.log ]; then
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -100 /tmp/ash-output.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload scan results
        if: always() && steps.changed-files.outputs.any_changed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ash-pr-scan-results
          path: |
            /tmp/ash-output.log
            /tmp/ash-output/reports/
          if-no-files-found: ignore
          retention-days: 30

      - name: Skip message
        if: steps.changed-files.outputs.any_changed == 'false'
        run: echo "No added or modified files - skipping ASH scan"
