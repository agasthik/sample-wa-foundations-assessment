name: Bug report
description: Report a reproducible problem with an assessment check, deployment, or report
title: "[Bug]: "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        ## Keep public reports non-sensitive

        Public issues are visible to everyone. Do not include credentials, customer data, AWS account IDs, resource ARNs, unredacted logs, vulnerability details, or exploit code.

        Report suspected vulnerabilities privately through this repository's **Security** tab by selecting **Report a vulnerability**. For AWS-related security issues, follow the [AWS vulnerability reporting process](https://aws.amazon.com/security/vulnerability-reporting/).

  - type: checkboxes
    id: acknowledgment
    attributes:
      label: Public disclosure acknowledgment
      options:
        - label: I have removed credentials, customer data, account identifiers, resource identifiers, and other sensitive information.
          required: true
        - label: This report does not disclose a suspected vulnerability or exploit.
          required: true

  - type: dropdown
    id: component
    attributes:
      label: Affected component
      options:
        - Assessment check (organization / org services / control tower / identity / account resources)
        - Maturity scoring
        - Deployment or CloudFormation (wafa-stack.yaml / deploy.sh)
        - CodeBuild execution
        - HTML, CSV, or JSON report
        - Region or account-type discovery
        - Documentation
        - Tests or development tooling
        - Other
    validations:
      required: true

  - type: input
    id: check_ref
    attributes:
      label: Check name or requirement (FR-#)
      description: Include the exact check display name and/or the functional requirement number when relevant.
      placeholder: "Example: FR-4 \"GuardDuty enabled\" or FR-7 CUR report"
    validations:
      required: false

  - type: dropdown
    id: account_mode
    attributes:
      label: Account mode
      description: How the assessed account was classified (see README "Account Modes").
      options:
        - Management account
        - Member account
        - Standalone account
        - Not applicable
        - Not sure
    validations:
      required: true

  - type: dropdown
    id: run_mode
    attributes:
      label: Run mode
      options:
        - Deployed stack (CodeBuild)
        - Local (python -m src.main)
        - CloudShell
        - Not applicable
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Provide the release version or Git commit when known.
      placeholder: "Example: v1.0.0 or abc1234"
    validations:
      required: false

  - type: input
    id: partition_regions
    attributes:
      label: AWS partition and Region(s)
      description: List only partition and Region names; do not include account or resource identifiers.
      placeholder: "Example: aws, us-east-1, us-west-2"
    validations:
      required: false

  - type: textarea
    id: description
    attributes:
      label: Problem description
      description: Clearly describe the problem and when it occurs.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Provide the smallest reproducible sequence using sanitized values.
      placeholder: |
        1. Deploy or run ...
        2. Assess account type ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: Describe the observed behavior, check status, or error.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected result
      description: Describe what should have happened instead.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs or report excerpt
      description: Include only the minimum relevant excerpt after removing all sensitive values and identifiers.
      render: shell
    validations:
      required: false

  - type: input
    id: report_environment
    attributes:
      label: Report viewing environment
      description: For HTML report issues only, provide the browser and version.
      placeholder: "Example: Chrome 128"
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add non-sensitive references, screenshots, or configuration details.
    validations:
      required: false
